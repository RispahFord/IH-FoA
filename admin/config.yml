backend:
  name: git-gateway
  branch: main

# Rispah will land on dev--ih-foa.netlify.app or ih-foa.com/admin depending
# on which URL she is invited through. Netlify Identity handles the login,
# Git Gateway commits her changes back to GitHub on her behalf.

media_folder: "images/blog-uploads"
public_folder: "/images/blog-uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    files:
      - name: "posts"
        label: "All Posts"
        file: "blog-data.json"
        description: "Add, edit, or remove posts here. New posts appear on the homepage and the Resources page automatically."
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Category", name: "category", widget: "string", hint: "Short label, e.g. Silica Safety, OSHA Compliance" }
              - { label: "Excerpt", name: "excerpt", widget: "text", hint: "One or two sentences, shows on the card and as the page summary" }
              - { label: "Cover Image", name: "image", widget: "image" }
              - { label: "Read Time", name: "readTime", widget: "string", default: "5 min read" }
              - { label: "Featured", name: "featured", widget: "boolean", default: false, hint: "For internal reference only, the featured spot on Resources is set manually" }
              - { label: "Body", name: "body", widget: "markdown", hint: "The full post" }
